# Configuration Nginx pour Flexpilot IDE
# À placer dans /etc/nginx/sites-available/flexpilot-ide

server {
    listen 80;
    server_name votre-domaine.com www.votre-domaine.com;

    # Redirection HTTP vers HTTPS (décommenter après SSL)
    # return 301 https://$server_name$request_uri;

    # Logs
    access_log /var/log/nginx/flexpilot-ide-access.log;
    error_log /var/log/nginx/flexpilot-ide-error.log;

    # Taille maximale des uploads
    client_max_body_size 100M;

    # Timeouts pour WebSockets
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache bypass pour WebSocket
        proxy_cache_bypass $http_upgrade;
        
        # Buffers
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

