services:
  - type: web
    name: flexpilot-ide
    env: node
    buildCommand: npm install --ignore-scripts && npm run download-builtin-extensions && npm run compile-build && npm run compile-web && npm run minify-vscode-reh-web
    startCommand: npm run render:start
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VSCODE_SKIP_PRELAUNCH
        value: "1"
    healthCheckPath: /
    autoDeploy: true

